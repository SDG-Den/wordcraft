# Evaluates the Nix flake (no build, about a minute): `nix build` / `nix develop` stop at evaluation
# when Cargo.lock gains something nix/package.nix can't vendor, and nothing else would notice.
name: Nix

on:
  push:
    branches: [main]
    paths: ["flake.nix", "flake.lock", "nix/**", "Cargo.lock", ".github/workflows/nix.yml"]
  pull_request:
    paths: ["flake.nix", "flake.lock", "nix/**", "Cargo.lock", ".github/workflows/nix.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  git-sources:
    name: Git dependencies come from an allowed owner
    uses: SDG-Den/craft-common-actions/.github/workflows/git-sources.yml@main

  nix:
    needs: git-sources
    # Intentionally tracked at @main (not SHA-pinned) so CI improvements propagate without PR
    # churn across all craftapp repos.
    uses: SDG-Den/craft-common-actions/.github/workflows/nix.yml@main

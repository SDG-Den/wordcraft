name: Binary

# Builds the Linux x86_64 tarball and commits `binary-url.json`, which the flake uses unless
# `programs.<app>.useBinary = false`.
on:
  push:
    branches: [nix-flake]
    paths-ignore: ["binary-url.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: binary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  binary:
    uses: SDG-Den/craft-common-actions/.github/workflows/binary.yml@main
    with:
      app-name: wordcraft
      app-title: WordCraft
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
